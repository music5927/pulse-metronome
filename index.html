<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10131a" />
  <title>Pulse — 메트로놈</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell" aria-labelledby="app-title">
    <header class="app-header">
      <div>
        <p class="eyebrow">PRECISION PRACTICE TOOL</p>
        <h1 id="app-title">Pulse</h1>
      </div>
      <p id="status" class="status" aria-live="polite">준비됨</p>
    </header>

    <section class="tempo-panel" aria-label="템포 설정">
      <p class="section-label">TEMPO</p>
      <div class="tempo-display">
        <button class="round-button subtle" id="tempo-down" type="button" aria-label="BPM 1 낮추기">−</button>
        <label class="tempo-input-wrap">
          <input id="tempo-input" type="number" inputmode="numeric" min="40" max="240" value="120" aria-label="분당 박자 BPM" />
          <span>BPM</span>
        </label>
        <button class="round-button subtle" id="tempo-up" type="button" aria-label="BPM 1 높이기">+</button>
      </div>
      <input id="tempo-slider" class="tempo-slider" type="range" min="40" max="240" value="120" aria-label="BPM 슬라이더" />
      <div class="range-labels"><span>40</span><span>240</span></div>
    </section>

    <section class="beat-section" aria-label="박자와 클릭 설정">
      <div class="beat-visual-wrap">
        <div id="beat-light" class="beat-light idle" aria-hidden="true">
          <span id="beat-number">1</span>
          <span class="beat-total">/ <span id="beat-count">4</span></span>
        </div>
        <p id="beat-caption">다음 박자를 기다리는 중</p>
      </div>

      <div class="setting-grid">
        <label class="setting-card" for="beats-input">
          <span>박자</span>
          <select id="beats-input" aria-label="한 마디의 박자 수">
            <option value="2">2</option><option value="3">3</option><option value="4" selected>4</option>
            <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
          </select>
        </label>
        <label class="setting-card" for="division-input">
          <span>음표</span>
          <select id="division-input" aria-label="박자 음표 단위">
            <option value="2">2분음표</option><option value="4" selected>4분음표</option><option value="8">8분음표</option>
          </select>
        </label>
        <label class="setting-card volume-card" for="volume-input">
          <span>볼륨</span>
          <input id="volume-input" type="range" min="0" max="100" value="70" aria-label="클릭 볼륨" />
        </label>
      </div>

      <div class="accent-panel" aria-labelledby="accent-title">
        <div class="accent-heading">
          <div><p id="accent-title" class="setting-title">강박 설정</p><p class="setting-help">강하게 들릴 박자를 선택하세요.</p></div>
          <span id="accent-summary" class="accent-summary">1박</span>
        </div>
        <div id="accent-controls" class="accent-controls" role="group" aria-label="강박으로 설정할 박자"></div>
      </div>
    </section>

    <section class="controls" aria-label="메트로놈 재생 제어">
      <button id="tap-button" class="tap-button" type="button">TAP<span>템포 맞추기</span></button>
      <button id="play-button" class="play-button" type="button" aria-pressed="false">
        <span class="play-icon" aria-hidden="true"></span><span id="play-label">시작</span>
      </button>
      <button id="mute-button" class="sound-button" type="button" aria-label="소리 켜짐" aria-pressed="false">
        <span id="sound-icon" aria-hidden="true">🔊</span><span id="sound-label">소리 켜짐</span>
      </button>
    </section>

    <p class="keyboard-hint">스페이스바로 시작 또는 정지 · 탭 버튼을 2회 이상 눌러 BPM 설정</p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10131a" />
  <title>Pulse — 메트로놈</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell" aria-labelledby="app-title">
    <header class="app-header">
      <div>
        <p class="eyebrow">PRECISION PRACTICE TOOL</p>
        <h1 id="app-title">Pulse</h1>
      </div>
      <p id="status" class="status" aria-live="polite">준비됨</p>
    </header>

    <section class="tempo-panel" aria-label="템포 설정">
      <p class="section-label">TEMPO</p>
      <div class="tempo-display">
        <button class="round-button subtle" id="tempo-down" type="button" aria-label="BPM 1 낮추기">−</button>
        <label class="tempo-input-wrap">
          <input id="tempo-input" type="number" inputmode="numeric" min="40" max="240" value="120" aria-label="분당 박자 BPM" />
          <span>BPM</span>
        </label>
        <button class="round-button subtle" id="tempo-up" type="button" aria-label="BPM 1 높이기">+</button>
      </div>
      <input id="tempo-slider" class="tempo-slider" type="range" min="40" max="240" value="120" aria-label="BPM 슬라이더" />
      <div class="range-labels"><span>40</span><span>240</span></div>
    </section>

    <section class="beat-section" aria-label="박자와 클릭 설정">
      <div class="beat-visual-wrap">
        <div id="beat-light" class="beat-light idle" aria-hidden="true">
          <span id="beat-number">1</span>
          <span class="beat-total">/ <span id="beat-count">4</span></span>
        </div>
        <p id="beat-caption">다음 박자를 기다리는 중</p>
      </div>

      <div class="setting-grid">
        <label class="setting-card" for="beats-input">
          <span>박자</span>
          <select id="beats-input" aria-label="한 마디의 박자 수">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
        </label>
        <label class="setting-card" for="division-input">
          <span>음표</span>
          <select id="division-input" aria-label="박자 음표 단위">
            <option value="2">2분음표</option>
            <option value="4" selected>4분음표</option>
            <option value="8">8분음표</option>
          </select>
        </label>
        <label class="setting-card volume-card" for="volume-input">
          <span>볼륨</span>
          <input id="volume-input" type="range" min="0" max="100" value="70" aria-label="클릭 볼륨" />
        </label>
      </div>
    </section>

    <section class="controls" aria-label="메트로놈 재생 제어">
      <button id="tap-button" class="tap-button" type="button">TAP<span>템포 맞추기</span></button>
      <button id="play-button" class="play-button" type="button" aria-pressed="false">
        <span class="play-icon" aria-hidden="true"></span>
        <span id="play-label">시작</span>
      </button>
      <button id="mute-button" class="icon-button" type="button" aria-label="소리 켜짐" aria-pressed="false">◖))</button>
    </section>

    <section class="quick-tempo" aria-label="빠른 BPM 선택">
      <p class="section-label">QUICK TEMPO</p>
      <div class="preset-list">
        <button type="button" data-tempo="60">Largo <strong>60</strong></button>
        <button type="button" data-tempo="90">Andante <strong>90</strong></button>
        <button type="button" data-tempo="120">Moderato <strong>120</strong></button>
        <button type="button" data-tempo="160">Allegro <strong>160</strong></button>
      </div>
    </section>

    <p class="keyboard-hint">스페이스바로 시작 또는 정지 · 탭 버튼을 2회 이상 눌러 BPM 설정</p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
